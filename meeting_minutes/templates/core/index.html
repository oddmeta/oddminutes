<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小奥会议纪要 - 您自己的音频会议纪要助手！</title>    
    {% load static %}
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=3">
</head>
<body>
    <div id="app">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>小奥会议纪要</h1>
                <button id="new-meeting-btn" class="btn-primary">
                    <span>+</span> 新会议
                </button>
            </div>

            <div class="search-box">
                <input type="text" id="search-input" placeholder="搜索转录内容...">
                <button id="search-btn">搜索</button>
            </div>

            <div class="meeting-list" id="meeting-list">
                <!-- 会议列表动态加载 -->
            </div>

            <div class="sidebar-footer">
                <button id="settings-btn" class="btn-icon" title="设置">⚙️</button>
                <button id="import-btn" class="btn-icon" title="导入音频">📁</button>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 录音控制面板 -->
            <div class="recording-panel" id="recording-panel">
                <div class="device-selection">
                    <select id="mic-device">
                        <option value="">选择麦克风</option>
                    </select>
                    <label class="checkbox-label">
                        <input type="checkbox" id="enable-system-audio">
                        录制系统音频
                    </label>
                    <select id="system-device" disabled>
                        <option value="">选择系统音频设备</option>
                    </select>
                </div>

                <div class="level-meters">
                    <div class="level-bar-container">
                        <label>麦克风</label>
                        <div class="level-bar">
                            <div class="level-fill" id="mic-level"></div>
                        </div>
                        <span id="mic-level-value">-∞ dB</span>
                    </div>
                    <div class="level-bar-container">
                        <label>系统音频</label>
                        <div class="level-bar">
                            <div class="level-fill" id="system-level"></div>
                        </div>
                        <span id="system-level-value">-∞ dB</span>
                    </div>
                </div>

                <div class="recording-controls">
                    <button id="record-btn" class="btn-record">
                        <span class="record-icon">●</span>
                        <span id="record-text">开始录音</span>
                    </button>
                    <button id="pause-btn" class="btn-pause" disabled>
                        暂停
                    </button>
                    <span id="recording-timer">00:00:00</span>
                </div>
            </div>

            <!-- 欢迎页面（无选中会议时） -->
            <div class="welcome-page" id="welcome-page">
                <div class="welcome-content">
                    <h2>欢迎使用小奥会议纪要</h2>
                    <p>点击"新会议"开始录制，或选择左侧的历史会议查看详情。</p>
                    <div class="feature-list">
                        <div class="feature-item">
                            <span class="feature-icon">🎙️</span>
                            <span>麦克风 + 系统音频双轨录制</span>
                        </div>
                        <div class="feature-item">
                            <span class="feature-icon">📝</span>
                            <span>AI 实时转录</span>
                        </div>
                        <div class="feature-item">
                            <span class="feature-icon">🤖</span>
                            <span>智能摘要生成</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 会议详情面板 -->
            <div class="meeting-detail hidden" id="meeting-detail">
                <div class="detail-header">
                    <input type="text" id="meeting-title" class="title-input" placeholder="会议标题">
                    <div class="detail-actions">
                        <button id="export-btn" class="btn-secondary">导出</button>
                        <button id="delete-btn" class="btn-danger">删除</button>
                    </div>
                </div>

                <div class="detail-tabs">
                    <button class="tab-btn active" data-tab="transcript">转录</button>
                    <button class="tab-btn" data-tab="summary">AI 摘要</button>
                    <button class="tab-btn" data-tab="notes">笔记</button>
                </div>

                <div class="tab-content">
                    <!-- 转录面板 -->
                    <div class="tab-panel active" id="transcript-panel">
                        <div class="transcript-sticky-bar">
                            <div class="audio-player-section" id="audio-player-section">
                                <audio id="meeting-audio" controls preload="metadata"></audio>
                            </div>
                            <div class="transcript-toolbar">
                                <div class="transcript-toolbar-left">
                                    <button id="retranscribe-btn" class="btn-secondary">重新转录</button>
                                    <select id="transcript-language">
                                        <option value="auto">自动检测</option>
                                        <option value="zh">中文</option>
                                        <option value="en">英文</option>
                                    </select>
                                </div>
                                <div class="transcript-toolbar-right">
                                    <button id="edit-mode-btn" class="btn-secondary">编辑模式</button>
                                    <button id="save-all-transcripts-btn" class="btn-primary hidden">保存全部</button>
                                    <button id="cancel-edit-btn" class="btn-secondary hidden">取消编辑</button>
                                </div>
                            </div>
                        </div>
                        <div class="transcript-content" id="transcript-content">
                            <!-- 转录内容 -->
                        </div>
                        <div class="transcribing-indicator hidden" id="transcribing-indicator">
                            <div class="funnel-spinner"></div>
                            <p>正在转录中，请稍候...</p>
                        </div>
                    </div>

                    <!-- 摘要面板 -->
                    <div class="tab-panel" id="summary-panel">
                        <div class="summary-toolbar">
                            <button id="generate-summary-btn" class="btn-primary">生成摘要</button>
                            <button id="regenerate-summary-btn" class="btn-secondary hidden">重新生成</button>
                            <select id="summary-provider">
                                <option value="ollama">Ollama (本地)</option>
                                <option value="openai">OpenAI</option>
                                <option value="claude">Claude</option>
                                <option value="groq">Groq</option>
                            </select>
                            <select id="summary-language">
                                <option value="zh">中文</option>
                                <option value="en">English</option>
                            </select>
                        </div>
                        <div class="summary-content" id="summary-content">
                            <div class="empty-state">点击"生成摘要"按钮生成 AI 摘要</div>
                        </div>
                        <div class="transcribing-indicator hidden" id="summary-processing-indicator">
                            <div class="funnel-spinner"></div>
                            <p>正在生成纪要中，请稍候...</p>
                        </div>
                    </div>

                    <!-- 笔记面板 -->
                    <div class="tab-panel" id="notes-panel">
                        <div class="notes-toolbar">
                            <button id="save-notes-btn" class="btn-primary">保存笔记</button>
                        </div>
                        <textarea id="notes-editor" class="notes-editor" placeholder="在这里输入会议笔记，支持 Markdown 格式..."></textarea>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 设置模态框 -->
    <div class="modal hidden" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>设置</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="settings-section">
                    <h4>转录设置</h4>
                    <div class="form-group">
                        <label>OddASR 地址</label>
                        <input type="text" id="oddasr-host" placeholder="127.0.0.1:9002">
                    </div>
                </div>
                <div class="settings-section">
                    <h4>AI 模型配置</h4>
                    <div id="model-config-list" class="model-config-list">
                        <!-- 配置列表动态加载 -->
                    </div>
                    <button id="add-model-config-btn" class="btn-secondary" style="margin-top:10px;width:100%">+ 添加模型配置</button>
                    <div id="model-config-form" class="hidden" style="margin-top:15px;padding:12px;border:1px solid #ddd;border-radius:6px;background:#f9f9f9">
                        <input type="hidden" id="model-config-id">
                        <div class="form-group">
                            <label>提供商</label>
                            <select id="model-config-provider">
                                <option value="ollama">Ollama</option>
                                <option value="openai">OpenAI</option>
                                <option value="claude">Claude</option>
                                <option value="groq">Groq</option>
                                <option value="custom">自定义</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>模型名称</label>
                            <input type="text" id="model-config-name" placeholder="如 llama3、gpt-4o">
                        </div>
                        <div class="form-group">
                            <label>API Key</label>
                            <input type="password" id="model-config-api-key" placeholder="可选">
                        </div>
                        <div class="form-group">
                            <label>Base URL</label>
                            <input type="text" id="model-config-base-url" placeholder="如 http://localhost:11434/v1">
                        </div>
                        <div class="form-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="model-config-is-default">
                                设为默认配置
                            </label>
                        </div>
                        <div class="form-actions" style="display:flex;gap:8px;margin-top:10px">
                            <button id="save-model-config-btn" class="btn-primary" style="flex:1">保存配置</button>
                            <button id="cancel-model-config-btn" class="btn-secondary" style="flex:1">取消</button>
                        </div>
                    </div>
                </div>
                <div class="settings-section">
                    <h4>系统</h4>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="setting-minimize-tray">
                            最小化到托盘
                        </label>
                    </div>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="setting-enable-notifications">
                            启用通知
                        </label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="save-settings-btn" class="btn-primary">保存</button>
            </div>
        </div>
    </div>

    <!-- 导入音频模态框 -->
    <div class="modal hidden" id="import-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>导入音频</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="file-upload" id="file-upload-area">
                    <p>拖拽音频文件到此处，或点击选择文件</p>
                    <input type="file" id="audio-file-input" accept="audio/mpeg,audio/wav,audio/ogg,audio/flac,audio/webm">
                </div>
                <div class="form-group">
                    <label>语言</label>
                    <select id="import-language">
                        <option value="auto">自动检测</option>
                        <option value="zh">中文</option>
                        <option value="en">英文</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button id="start-import-btn" class="btn-primary">开始导入</button>
            </div>
        </div>
    </div>

    <script src="{% static 'js/app.js' %}?v=6&t={{ now|date:'U' }}"></script>
</body>
</html>
